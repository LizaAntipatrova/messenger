# ???????? ????????? ??????????
spring.application.name=messaging-service
# ?????????? ????????? ???? ??? ??????, ????? ???????? ??????????
server.port=0


# ????????? ??????????? ? Redis (??? ???????? ? ??????)
redis.host=localhost
redis.port=6379
# ????? ??????? ???????? ????????, ??? ??? RedissonClient ???????

# ????????? ??????????? ? Kafka (??? ???????? ? ??????)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.yazikochesalna.messagingservice.dto.events
spring.kafka.consumer.properties.spring.json.type.mapping=message:com.yazikochesalna.messagingservice.dto.events.EventDTO
spring.kafka.listener.ack-mode=MANUAL
# ???????? ??? Kafka ????? ???? ?????????, ??? ??? KafkaTemplate ???????

# ????????? ??? ????????? (?? ?????? ?? ?????)
frontend.origins=http://localhost:5173

# URL ??? ???????? ??????? (??????? ????? WebClient)
chat.service.url=http://localhost:8080

# ????????? JWT (??? ?????? ????? ???????????? ???????? ????)
security.jwt.secret_key=test-secret-key
security.jwt.access_token_expiration=3600
security.jwt.refresh_token_expiration=86400

# ??????????? (????? ????????? ??????? ??????????? ??? ??????)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
