spring.application.name=task-service

server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5435/task-database
spring.datasource.username=user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate/JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public

front.server.origins = ${FRONT_SERVER_URL}

spring.config.import=optional:file:.env[.properties]

security.jwt.secret_key = ${JWT_SECRET_KEY}
security.jwt.access_token_expiration = ${JWT_ACCESS_TOKEN_EXPIRATION}
security.jwt.refresh_token_expiration = ${JWT_REFRESH_TOKEN_EXPIRATION}
authorization.service.url = ${AUTHORIZATION_SERVICE_URL}
messaging.service.url = ${MESSAGING_SERVICE_URL}
webclient.timeout = ${WEBCLIENT_TIMEOUT}


openai.api-key: ${OPENAI_API_KEY}
openai.base-url: https://openai.bothub.ru/v1
openai.model: gpt-5.4-mini

llm.baseurl: http://localhost:11434/v1
llm.api-key: local
llm.model: deepseek-r1:7b
llm.temperature: 0.2
llm.max-tokens: 300
llm.timeout-seconds: 120
llm.system-prompt: >
Ты анализируешь текст в соответствии с инструкциями
Ты должен присылать в ответе только json, структура которого указана в промпте
Следуй инструкциям пользователя.
Если не знаешь ответ, пришли пустой json.